name: Daily Events Cleanup

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Call cleanup endpoint
        run: |
          BASE_URL="${{ vars.BASE_URL || github.event.repository.homepage }}"
          echo "Calling cleanup endpoint at $BASE_URL/api/events/cleanup"
          curl -X DELETE "$BASE_URL/api/events/cleanup"
